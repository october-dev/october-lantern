name: Windows release bundle

# Builds, signs (when Azure Artifact Signing or a .pfx is configured) and checks the Windows
# release, and uploads it as this run's artifact. Publishing is done from a maintainer's machine
# with scripts/publish-windows.sh, next to the Mac release.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: windows-latest
    env:
      # Where the in-app updater looks for new versions: the public releases repository.
      LANTERN_RELEASES_REPO: ${{ vars.LANTERN_RELEASES_REPO || 'harshsaver/october-lantern-releases' }}
      # PostHog project key for anonymous usage counts (desktop/src/analytics.rs); unset sends nothing.
      LANTERN_POSTHOG_KEY: ${{ secrets.LANTERN_POSTHOG_KEY }}
      CARGO_TARGET_DIR: ${{ github.workspace }}\build\target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            engine -> ../build/target
            desktop -> ../build/target
      - run: pwsh -File scripts/check.ps1
      - run: pwsh -File scripts/build-windows.ps1
      - run: pwsh -File scripts/build-bus-windows.ps1
      # Built fresh from the pinned source (no cache), then proven by transcribing a sample.
      - run: pwsh -File scripts/build-whisper-windows.ps1 -Verify
      - run: python scripts/smoke-windows.py --bus
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Package and sign
        env:
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: pwsh -File scripts/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: October-Lantern-windows-x86_64
          path: |
            build/October-Lantern-windows-x86_64.zip
            build/October-Lantern-windows-x86_64.zip.sha256
            build/October-Lantern-whisper-windows-x86_64.zip
            build/October-Lantern-whisper-windows-x86_64.zip.sha256
            build/October-Lantern-windows-x86_64-setup.exe
            build/October-Lantern-windows-x86_64-setup.exe.sha256
            build/release-info.json
