name: CI

on:
  push:
  pull_request:

jobs:
  check:
    # The app needs the macOS 26 SDK (Xcode 26).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Select the newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Checks (engine fmt, clippy, tests; app build and tests; script syntax)
        run: scripts/check.sh
