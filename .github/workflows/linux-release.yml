name: Linux release bundle

# Builds and checks the Linux release and uploads it as this run's artifact. Publishing is done
# from a maintainer's machine with scripts/publish-desktop.sh, next to the Mac release.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    env:
      # Where the in-app updater looks for new versions: the public releases repository.
      LANTERN_RELEASES_REPO: ${{ vars.LANTERN_RELEASES_REPO || 'harshsaver/october-lantern-releases' }}
      # PostHog project key for anonymous usage counts (desktop/src/analytics.rs); unset sends nothing.
      LANTERN_POSTHOG_KEY: ${{ secrets.LANTERN_POSTHOG_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            engine -> ../build/target
            desktop -> ../build/target
      - run: sudo apt-get update && sudo apt-get install -y tmux sqlite3 libgl1 libxkbcommon0 libwayland-client0
      - run: scripts/check.sh
      - run: scripts/build-app.sh
      - run: scripts/build-bus-linux.sh
      - run: python3 scripts/smoke-linux.py --bus
      - run: scripts/package-linux.sh
      - name: Release info
        run: |
          python3 - <<'PY'
          import json, subprocess, tomllib, os
          version = tomllib.load(open("engine/Cargo.toml", "rb"))["package"]["version"]
          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          info = {"version": version, "commit": commit, "releases": os.environ["LANTERN_RELEASES_REPO"], "signed": False}
          json.dump(info, open("build/release-info.json", "w"))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: October-Lantern-linux-x86_64
          path: |
            build/October-Lantern-linux-x86_64.tar.gz
            build/October-Lantern-linux-x86_64.tar.gz.sha256
            build/release-info.json
