[package]
name = "lantern-engine"
version = "0.3.4"
edition = "2024"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
hmac = "0.13.0"
libc = "0.2.189"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
snow = "0.10.0"
subtle = "2.6.1"
sysinfo = "0.39.6"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
toml_edit = "0.25.15"
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
ureq = { version = "3.4.2", features = ["json"] }
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
# Only the Noise interoperability test derives libsodium-style seed keys.
blake2 = "0.11.0"
